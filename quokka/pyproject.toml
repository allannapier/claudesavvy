[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quokka-harness"
version = "0.1.0"
description = "Visual viewer for the Claude Code agent harness — skills, MCPs, agents, hooks, slash commands, plugins, and how they interlink."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Quokka contributors" }]
keywords = ["claude-code", "harness", "skills", "mcp", "visualizer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "Jinja2>=3.0",
]

[project.scripts]
quokka = "quokka.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quokka = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
